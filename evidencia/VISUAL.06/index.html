<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cronometro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="stopWatch">
        <h1 class="time">00:00:00</h1>
        <div class="controls">
            <img src="https://cdn-icons-png.magnific.com/512/3054/3054783.png" onclick="stopTimer()" alt="stop">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/018/819/314/small/push-control-button-blue-steel-technology-switch-sign-symbol-business-electronic-equipment-icon-start-stop-off-on-object-power-device-communication-system-computer-multimedia-click-concept-3d-render-png.png" onclick="starTimer()" alt="start">
            <img src="https://cdn-icons-png.magnific.com/256/11507/11507214.png?semt=ais_white_label" onclick="resetTimer()" alt="reset">
        </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
